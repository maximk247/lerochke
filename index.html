/* Раскладка: ретро-рабочий стол. Бирюзовый фон, серые объёмные окна, «Рисовалка» посередине как сцена. */
:root{
  --desk:#0e7c7b;
  --face:#c3c3c3; --hi:#ffffff; --lt:#e3e3e3; --lo:#828282; --dk:#0b0b0b;
  --title-a:#5b1a4a; --title-b:#c9578e; --title-off-a:#808080; --title-off-b:#b8b8b8;
  --sel:#5b1a4a; --sel-fg:#ffffff;
  --text:#111111; --paper:#ffffff; --workspace:#7b7b7b; --handle:#26215c;
  --term-bg:#0d0d10; --term-fg:#d8d8d8; --term-dim:#8d8d96; --term-ok:#8be28b; --term-err:#ff6f80; --term-hl:#ffd479;
  --balloon:#ffffe1; --shadow:rgba(0,0,0,.28); --note:#3c3c3c;
  --ui:"Tiny5","Press Start 2P",Tahoma,monospace;
  --text:"PT Sans",Tahoma,Verdana,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --hand:"Pangolin","Comic Sans MS","Chalkboard SE",cursive;
  --raised:inset -1px -1px var(--dk),inset 1px 1px var(--hi),inset -2px -2px var(--lo),inset 2px 2px var(--lt);
  --raised-win:inset -1px -1px var(--dk),inset 1px 1px var(--lt),inset -2px -2px var(--lo),inset 2px 2px var(--hi);
  --pressed:inset -1px -1px var(--hi),inset 1px 1px var(--dk),inset -2px -2px var(--lt),inset 2px 2px var(--lo);
  --sunken:inset -1px -1px var(--hi),inset 1px 1px var(--lo),inset -2px -2px var(--lt),inset 2px 2px var(--dk);
  --thin:inset -1px -1px var(--hi),inset 1px 1px var(--lo);
  --dither:repeating-conic-gradient(var(--face) 0 25%,var(--hi) 0 50%) 0 0/2px 2px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;overflow:hidden;background:var(--desk)}
body{height:100%;margin:0;overflow:hidden;background:var(--desk);color:var(--text);font:15px/1.4 var(--text);overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:1px dotted var(--dk);outline-offset:-4px}

#app{position:relative;height:100%;display:flex;flex-direction:column}
#desk{position:relative;flex:1;min-height:0;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:relative;height:100%}

/* значки рабочего стола */
#icons{position:absolute;left:0;top:0;bottom:0;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:12px;z-index:1}
.dicon{display:flex;flex-direction:column;align-items:center;gap:5px;width:88px;padding:4px 2px;background:none;border:0;color:var(--hi);font-size:13px;line-height:1.2;cursor:pointer;text-align:center;overflow-wrap:anywhere}
.dicon svg{width:34px;height:34px;filter:drop-shadow(1px 1px 0 var(--shadow))}
.dicon span{padding:1px 3px;text-shadow:1px 1px 0 var(--shadow)}
.dicon:focus-visible{outline:none}
.dicon:focus-visible span,.dicon:active span{background:var(--sel);outline:1px dotted var(--hi);text-shadow:none}
#app.narrow #icons{top:auto;bottom:0;left:0;right:0;flex-direction:row;flex-wrap:nowrap;justify-content:space-between;gap:0;container-type:inline-size}
/* пять значков в ряд: шрифт подстраивается, чтобы «комплименты» не рвались посередине */
#app.narrow .dicon{width:auto;flex:1;max-width:96px;padding:4px 1px;font-size:11px;font-size:min(12px,calc((20cqw - 4px) / 6.1))}
#app.narrow .dicon span{padding:1px}

/* окна */
.win{position:absolute;display:flex;flex-direction:column;background:var(--face);box-shadow:var(--raised-win);padding:3px;min-width:0;z-index:5}
.win.min{opacity:0!important}
.win.min,.win.min *{pointer-events:none!important}
.tb{display:flex;align-items:center;gap:6px;height:24px;flex:none;padding:0 2px 0 4px;background:linear-gradient(90deg,var(--title-off-a),var(--title-off-b));color:var(--lt);font:16px/1 var(--ui);cursor:default;white-space:nowrap}
.win.active>.tb{background:linear-gradient(90deg,var(--title-a),var(--title-b));color:var(--hi)}
.tb .ico{width:16px;height:16px;flex:none;display:block}
.tb .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tbb{width:20px;height:18px;flex:none;display:grid;place-items:center;background:var(--face);box-shadow:var(--raised);border:0;padding:0;color:var(--dk);cursor:pointer}
.tbb+.tbb{margin-left:-4px}
.tbb.x{margin-left:0}
.tbb:active{box-shadow:var(--pressed)}
.tbb svg{width:10px;height:10px;display:block}
.btn{min-width:84px;min-height:30px;padding:3px 14px;font:16px/1 var(--ui);background:var(--face);box-shadow:var(--raised);border:0;color:var(--text);cursor:pointer;touch-action:manipulation}
.btn:active,.btn.pressed{box-shadow:var(--pressed)}
.btn.default{box-shadow:0 0 0 1px var(--dk),var(--raised)}
.btn.default:active{box-shadow:0 0 0 1px var(--dk),var(--pressed)}
.btn:disabled{color:var(--lo);text-shadow:1px 1px 0 var(--hi);cursor:default}
.btn.sm{min-width:0;min-height:22px;padding:1px 10px}
.btn.ic{padding:1px 7px;display:inline-grid;place-items:center}
.btn.ic svg{width:15px;height:15px;display:block}
.btn.ic:disabled svg{opacity:.35}

.dlg{width:min(400px,100%);z-index:50}
/* котик.gif в конце консоли: подпись поверх, как на мемах */
.catwin{width:min(300px,100%)}
.catpic{position:relative;margin:2px;box-shadow:var(--sunken);background:#000}
.catpic img{display:block;width:100%;height:auto}
.catcap{position:absolute;left:8px;right:8px;bottom:12px;font:700 23px/1.12 "PT Sans",Tahoma,sans-serif;color:#fff;text-align:center;-webkit-text-stroke:5px #000;paint-order:stroke fill;text-shadow:0 2px 0 #000;text-wrap:balance}
.term .termcat{position:relative;width:clamp(150px,58%,240px);margin:6px 0 8px;white-space:normal;container-type:inline-size;transform-origin:left top;animation:catpop .35s cubic-bezier(.2,1.6,.4,1)}
.term .termcat img{display:block;width:100%;height:auto;outline:1px solid var(--term-dim)}
.term .termcat .catcap{left:5px;right:5px;bottom:7px;font-size:15px;font-size:8.6cqw;-webkit-text-stroke:4px #000}
@keyframes catpop{from{scale:.3;opacity:0}}
.dlg-body{display:flex;gap:14px;padding:16px 14px 6px}
.dlg-ic{flex:none;width:34px;height:34px}
.dlg-ic svg{width:34px;height:34px;display:block}
.dlg-txt{min-width:0;flex:1;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.dlg-txt b{font-weight:700}
.dlg-btns{display:flex;justify-content:center;gap:8px;padding:12px 12px 10px;flex-wrap:wrap}
.dlg .note{display:block;margin-top:8px;font-size:13px;line-height:1.35;color:var(--note)}
.dlg img.result{display:block;width:min(220px,100%);height:auto;margin:10px auto 2px;box-shadow:var(--sunken);padding:2px;background:var(--paper);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#w-intro{left:50%;top:44%;transform:translate(-50%,-50%);width:min(390px,100%)}
.shake{animation:shake .38s}
@keyframes shake{20%{translate:-6px 0}40%{translate:6px 0}60%{translate:-4px 0}80%{translate:3px 0}}

/* командная строка */
.term{flex:1;min-height:0;margin:3px 0 0;background:var(--term-bg);color:var(--term-fg);font:13px/1.6 var(--mono);padding:10px 12px;box-shadow:var(--sunken);overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.term .dim{color:var(--term-dim)}
.term .ok{color:var(--term-ok)}
.term .err{color:var(--term-err)}
.term .hl{color:var(--term-hl)}
.caret{display:inline-block;width:.6em;height:1.05em;margin-left:1px;background:currentColor;vertical-align:-.15em;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}

/* Рисовалка */
.menubar{display:flex;flex:none;padding:2px 0 3px;font:16px/1.2 var(--ui);white-space:nowrap;overflow:hidden;position:relative}
.menubar>button{background:none;border:0;padding:2px 8px;cursor:pointer}
.menubar>button:hover,.menubar>button[aria-expanded="true"]{background:var(--sel);color:var(--sel-fg)}
.menubar u{text-decoration-thickness:1px;text-underline-offset:2px}
.pbody{display:flex;gap:3px;min-height:0}
.tools{display:grid;grid-template-columns:repeat(2,27px);grid-auto-rows:27px;align-content:start;padding:2px;flex:none}
.tool{width:100%;height:100%;display:grid;place-items:center;background:var(--face);box-shadow:var(--raised);border:0;padding:0;cursor:pointer;touch-action:manipulation}
.tool svg{width:18px;height:18px;display:block}
.tool.on,.tool.pressed,.sizebtn[aria-expanded="true"]{box-shadow:var(--pressed);background:var(--dither)}
.cv-area{position:relative;flex:1;min-width:0;background:var(--workspace);box-shadow:var(--sunken);padding:8px;overflow:hidden}
.sheet{position:relative;background:var(--paper);box-shadow:1px 1px 0 var(--dk);transition:transform .2s ease-out}
.sheet.zoomed{transform:scale(2)}
.sheet svg,.sheet canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.sheet.pet{touch-action:none}
#ink{pointer-events:none;touch-action:none}
#ink.on{pointer-events:auto}
.sheet canvas.inkmog{pointer-events:none;visibility:hidden}
.sheet.inkrig canvas.inkmog{visibility:visible}
.sheet.inkrig #ink{opacity:0}
.sheet .selsvg{pointer-events:none;overflow:visible}
.sheet .selsvg .ants{animation:ants .9s linear infinite}
@keyframes ants{to{stroke-dashoffset:-7}}
.sheet canvas.float{inset:auto;cursor:move;touch-action:none;outline:1px dashed var(--dk)}
.sheet .txtin{position:absolute;z-index:3;transform:translateY(-50%);margin:0;padding:0 2px;border:1px dashed var(--dk);border-radius:0;background:transparent;font-family:"Pangolin","Comic Sans MS",cursive;line-height:1.3;outline:none;-webkit-user-select:text;user-select:text}
.handle{position:absolute;width:5px;height:5px;background:var(--handle)}
.handle.h1{right:-6px;top:calc(50% - 2px)}
.handle.h2{left:calc(50% - 2px);bottom:-6px}
.handle.h3{right:-6px;bottom:-6px}
.palette{display:flex;align-items:center;gap:6px;flex:none;padding:5px 2px 4px}
.curcol{position:relative;width:34px;height:34px;flex:none;box-shadow:var(--sunken);background:var(--dither);cursor:pointer}
.curcol i{position:absolute;width:15px;height:15px;box-shadow:inset 0 0 0 1px var(--dk),inset 0 0 0 2px var(--hi)}
.curcol .bgc{right:5px;bottom:5px;background:var(--paper)}
.curcol .fgc{left:5px;top:5px;background:#26213a}
.swatches{display:grid;grid-template-columns:repeat(14,var(--sw,17px));grid-auto-rows:var(--sw,17px);gap:1px}
.sw{width:100%;height:100%;border:0;padding:0;background:var(--c);box-shadow:var(--thin),inset 0 0 0 2px var(--face);cursor:pointer;touch-action:manipulation}
.sw.pressed,.sw:active{box-shadow:inset 0 0 0 2px var(--dk)}
.sw.glow{position:relative;z-index:1;animation:glow .6s 7}
@keyframes glow{0%,50%{outline:2px solid #e0457b;outline-offset:1px}51%,100%{outline:2px solid transparent;outline-offset:1px}}
/* кнопка «МОГНУТЬ»: появляется, когда такса готова */
.mogbtn{margin-left:auto;flex:none;align-self:stretch;min-width:96px;padding:0 12px;border:0;cursor:pointer;font:20px/1 var(--ui);letter-spacing:.04em;color:#fff;background:linear-gradient(#ff4a3d,#c1121f 55%,#7a0010);box-shadow:var(--raised),0 0 0 2px #000;text-shadow:2px 2px 0 #000;animation:mogglow 1.1s ease-in-out infinite;touch-action:manipulation}
.mogbtn:active{box-shadow:var(--pressed),0 0 0 2px #000;padding:2px 11px 0 13px}
.mogbtn.off{visibility:hidden;animation:none}
.mogbtn.pop{animation:mogpop .5s cubic-bezier(.2,1.8,.4,1),mogglow 1.1s .5s ease-in-out infinite}
@keyframes mogglow{50%{box-shadow:var(--raised),0 0 0 2px #000,0 0 12px 4px #ffc90e}}
@keyframes mogpop{from{scale:.2}}
/* «бай-бай»: окно трясёт, лист бьёт, челюсть горит, вспышка, надпись и золотые искры */
.win.mogshake{animation:mogshake .8s cubic-bezier(.36,.07,.19,.97)}
@keyframes mogshake{8%{translate:-22px 10px;rotate:-2deg}18%{translate:20px -11px;rotate:1.8deg}28%{translate:-17px 8px;rotate:-1.4deg}38%{translate:14px -7px;rotate:1.1deg}50%{translate:-10px 5px;rotate:-.7deg}64%{translate:7px -3px;rotate:.4deg}80%{translate:-3px 1px;rotate:-.1deg}}
.sheet.mogpunch{animation:mogpunch .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes mogpunch{30%{scale:1.2}}
.dogsvg.mogging .jaw{stroke-width:7.5;filter:drop-shadow(0 0 3px #ffc90e) drop-shadow(0 0 10px #ff7f27)}
/* и лицо как при поглаживании: прищур, бровь, ухмылка */
.dogsvg.mogging .eye{animation:none;transform:scaleY(.62)}
.dogsvg.mogging .brow-r{transform:translateY(-4px) rotate(-9deg)}
.dogsvg.mogging .lipO{opacity:0}
.dogsvg.mogging .lipH{opacity:1}
/* в конце могания с лапой губы уточкой */
.dogsvg .lipD{opacity:0;transition:opacity .12s;transform-box:view-box;transform-origin:330px 192px}
.dogsvg.duck .lipO,.dogsvg.duck .lipH{opacity:0}
.dogsvg.duck .lipD{opacity:1;animation:duckpop .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes duckpop{from{transform:scale(.3)}}
/* и скулы: тень под скулой темнеет, по скуле пробегает золотой блик */
.dogsvg .cheek{transition:opacity .15s}
.dogsvg .cheekhi{opacity:0;stroke-dasharray:1 1;stroke-dashoffset:1}
.dogsvg.mogging .cheek{opacity:1}
.dogsvg.mogging .cheekhi{opacity:1;animation:cheekhi .3s .06s ease-out forwards;filter:drop-shadow(0 0 3px #ffc90e) drop-shadow(0 0 8px #ff7f27)}
@keyframes cheekhi{to{stroke-dashoffset:0}}
.flash{position:absolute;inset:0;background:radial-gradient(circle at var(--x) var(--y),#fffbe6 0,rgba(255,201,14,.75) 22%,rgba(255,127,39,.25) 48%,transparent 72%);animation:flash .55s ease-out forwards}
@keyframes flash{from{opacity:1}to{opacity:0}}
.byebye{position:absolute;font:clamp(40px,11vw,88px)/1 var(--ui);color:#ffc90e;-webkit-text-stroke:6px #000;paint-order:stroke fill;white-space:nowrap;text-shadow:4px 4px 0 #000;animation:byebye 1.6s ease-out forwards}
@keyframes byebye{0%{transform:translate(-50%,-50%) scale(.2) rotate(-14deg);opacity:0}14%{transform:translate(-50%,-50%) scale(1.3) rotate(-7deg);opacity:1}28%{transform:translate(-50%,-50%) scale(1) rotate(-5deg)}75%{opacity:1}100%{transform:translate(-50%,-85%) scale(1.06) rotate(-5deg);opacity:0}}
.spark{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;animation:spark .9s cubic-bezier(.1,.7,.3,1) forwards}
.spark svg{display:block;width:100%;height:100%}
@keyframes spark{from{transform:translate(0,0) scale(1.5) rotate(0)}to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(var(--rot));opacity:0}}
.status{display:flex;gap:3px;flex:none;font-size:13px}
.status>div{box-shadow:var(--thin);padding:2px 6px;min-height:24px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.status .msg{flex:1;min-width:0;display:block;line-height:20px;text-overflow:ellipsis}
.status .pos{width:96px;flex:none;font-variant-numeric:tabular-nums}
.status .size{flex:none}
.status .acts{flex:none;box-shadow:none;padding:0 2px}

.win.narrow .pbody{flex-direction:column}
.win.narrow .tools{display:flex;flex-wrap:nowrap;gap:0;padding:0 0 2px}
.win.narrow .tool{flex:1 1 0;min-width:0;max-width:34px;height:30px}
.win.narrow .cv-area{padding:6px}
.win.narrow .status .size{display:none}
.win.narrow .mogbtn{min-width:0;padding:0 8px;font-size:15px}
.palette.wrap{flex-wrap:wrap}
.palette.wrap .mogbtn{flex:1 0 100%;height:32px;margin-left:0;font-size:18px}
.win.narrow .status .pos{width:76px}
.win.narrow .status .acts:not([hidden])~.pos{display:none}
.win.narrow .menubar>button{padding:2px 6px}
.win.narrow .menubar>[data-menu="view"]{display:none}
@media (max-width:370px){.win.narrow .menubar>[data-menu="help"]{display:none}}

/* выпадающие меню */
.dropdown{position:absolute;z-index:60;display:flex;flex-direction:column;min-width:210px;padding:2px;background:var(--face);box-shadow:var(--raised-win)}
.dropdown button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:7px 18px;text-align:left;cursor:pointer;font:16px/1 var(--ui)}
.dropdown button:hover,.dropdown button:focus-visible{background:var(--sel);color:var(--sel-fg);outline:none}
.dropdown hr{border:0;height:2px;margin:3px 2px;box-shadow:inset 0 1px var(--lo),inset 0 -1px var(--hi)}
.dropdown button span{flex:1}
.dropdown kbd{font:inherit;opacity:.7;padding-left:22px}
.dropdown button:disabled{color:var(--lo);text-shadow:1px 1px 0 var(--hi);cursor:default}
.dropdown button:disabled:hover{background:none;color:var(--lo)}
/* толщина: пять образцов, выбранный подсвечен */
.dropdown.sizes{min-width:0;width:118px}
.dropdown.sizes button{justify-content:center;min-height:32px;padding:6px 14px}
.dropdown.sizes i{flex:1;background:currentColor;border-radius:9px}
.dropdown.sizes svg{display:block;fill:currentColor}
.dropdown.sizes b{font-weight:400;font-family:"Pangolin","Comic Sans MS",cursive;line-height:1}
.dropdown.sizes [aria-checked="true"]{background:var(--sel);color:var(--sel-fg)}

/* блокнот */
.notes{flex:1;min-height:0;margin:3px 0 0;resize:none;border:0;background:var(--paper);color:var(--text);box-shadow:var(--sunken);padding:10px 12px;font:14px/1.6 var(--mono);white-space:pre-wrap;-webkit-user-select:text;user-select:text}

/* всплывающая подсказка */
.balloon{position:absolute;z-index:70;width:max-content;max-width:min(270px,calc(100% - 12px));background:var(--balloon);color:var(--text);border:1px solid var(--dk);border-radius:9px;padding:8px 26px 9px 10px;font-size:14px;line-height:1.38;box-shadow:2px 3px 0 var(--shadow);cursor:pointer;animation:pop .18s ease-out}
.balloon b{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-weight:700}
.balloon b svg{width:16px;height:16px;flex:none}
.balloon .bx{position:absolute;right:7px;top:6px;font-size:13px;line-height:1}
.balloon::before,.balloon::after{content:"";position:absolute;left:var(--tail,40px);border:solid transparent}
.balloon::before{bottom:-13px;border-width:13px 13px 0 0;border-top-color:var(--dk)}
.balloon::after{bottom:-11px;left:calc(var(--tail,40px) + 1px);border-width:11px 11px 0 0;border-top-color:var(--balloon)}
.balloon.below::before{bottom:auto;top:-13px;border-width:0 13px 13px 0;border-color:transparent;border-bottom-color:var(--dk)}
.balloon.below::after{bottom:auto;top:-11px;border-width:0 11px 11px 0;border-color:transparent;border-bottom-color:var(--balloon)}
.balloon.fixed{position:fixed;z-index:2900}
@keyframes pop{from{transform:scale(.85);opacity:0}}

/* панель задач */
#taskbar{position:relative;flex:none;height:42px;display:flex;align-items:center;gap:6px;background:var(--face);box-shadow:inset 0 1px var(--lt),inset 0 2px var(--hi);padding-block:4px 3px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:1000}
#start{display:flex;align-items:center;gap:6px;min-width:0;height:32px;padding:0 10px 0 6px}
#start svg{width:18px;height:18px}
#start[aria-expanded="true"]{box-shadow:var(--pressed)}
#tasks{flex:1;min-width:0;display:flex;gap:4px;overflow:hidden}
.task{display:flex;align-items:center;gap:6px;height:32px;flex:0 1 190px;min-width:0;padding:0 8px;background:var(--face);box-shadow:var(--raised);border:0;cursor:pointer;font:16px/1 var(--ui);white-space:nowrap}
.task svg{width:16px;height:16px;flex:none}
.task span{overflow:hidden;text-overflow:ellipsis}
.task.on{box-shadow:var(--pressed);background:var(--dither)}
.tray{display:flex;align-items:center;gap:4px;height:32px;padding:0 4px 0 6px;box-shadow:var(--thin);flex:none}
.tray button{display:grid;place-items:center;height:28px;min-width:28px;background:none;border:0;padding:0 4px;cursor:pointer;font:16px/1 var(--ui)}
.tray svg{width:17px;height:17px}
#app.narrow .task span{display:none}
#app.narrow .task{flex:0 0 auto}

/* меню «Пуск» */
#startmenu{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:40px;z-index:1500;display:flex;background:var(--face);box-shadow:var(--raised-win);padding:3px;width:min(280px,calc(100% - 32px))}
.sm-band{width:30px;flex:none;display:flex;align-items:flex-end;justify-content:center;padding:10px 0;background:linear-gradient(0deg,var(--title-a),var(--title-b));color:var(--hi);font:24px/1 var(--ui);letter-spacing:.04em}
.sm-band span{writing-mode:vertical-rl;transform:rotate(180deg)}
.sm-band b{font-weight:400;opacity:.8}
.sm-list{flex:1;display:flex;flex-direction:column;padding:2px 0;min-width:0}
.sm-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:none;border:0;text-align:left;cursor:pointer;font:16px/1.1 var(--ui)}
.sm-item svg{width:24px;height:24px;flex:none}
.sm-item:hover,.sm-item:focus-visible{background:var(--sel);color:var(--sel-fg);outline:none}
.sm-sep{height:2px;margin:3px 2px;box-shadow:inset 0 1px var(--lo),inset 0 -1px var(--hi)}

/* эффекты, курсор, рамка открытия окна */
#fx{position:fixed;inset:0;pointer-events:none;z-index:2800;overflow:hidden}
.puff{position:absolute;left:0;top:0;animation:puff 1.15s ease-out forwards;will-change:transform,opacity}
@keyframes puff{from{transform:translate(-50%,-50%) scale(.5);opacity:1}to{transform:translate(calc(-50% + var(--dx,0px)),calc(-50% - 70px)) scale(1.15);opacity:0}}
.say{display:block;font:24px/1 var(--ui);color:#e0457b;-webkit-text-stroke:3px var(--hi);paint-order:stroke fill;white-space:nowrap}
.confetto{position:absolute;top:-26px;transform:scale(var(--s,1));animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx,0px),calc(100vh + 60px)) rotate(var(--rot,0deg)) scale(var(--s,1))}}
#cursor{position:fixed;left:0;top:0;z-index:3000;pointer-events:none;transform:translate(-200px,-200px);transition:opacity .35s}
#cursor svg{display:block;transition:transform .08s;transform-origin:var(--hx,0) var(--hy,0)}
#cursor.down svg{transform:scale(.86)}
#cursor.gone{opacity:0}
#zoom{position:fixed;z-index:2500;pointer-events:none;border:2px dotted var(--hi);mix-blend-mode:difference}
#measure{position:absolute;left:-9999px;top:0;width:10px;height:10px;overflow:hidden}

/* живая такса */
.dogsvg{overflow:visible}
.dogsvg .tail{transform-box:view-box;transform-origin:66px 198px}
.dogsvg .ear-l{transform-box:view-box;transform-origin:292px 86px}
.dogsvg .ear-r{transform-box:view-box;transform-origin:368px 86px}
.dogsvg .eye{transform-box:fill-box;transform-origin:center}
.dogsvg .dog{transform-box:view-box;transform-origin:210px 300px}
.dogsvg .head-all{transform-box:view-box;transform-origin:330px 210px;transition:transform .35s ease}
.dogsvg .brow-r{transform-box:view-box;transform-origin:339px 113px;transition:transform .2s ease-out}
.dogsvg .lipO,.dogsvg .lipH{transition:opacity .12s}
.dogsvg .lipH{opacity:0}
.alive .tail{animation:wag 1.5s ease-in-out infinite}
.alive .eye{animation:blink 5.2s infinite}
.alive .ear-l{animation:flop 7s infinite}
.alive .ear-r{animation:flop 9s 2.2s infinite reverse}
.alive .dog{animation:breathe 3.2s ease-in-out infinite}
/* гладят: хвост молотит, а морда держит лицо: прищур, бровь, ухмылка */
.happy .tail{animation-duration:.3s}
.happy .eye{animation:none;transform:scaleY(.62)}
.happy .brow-r{transform:translateY(-4px) rotate(-9deg)}
.happy .lipO{opacity:0}
.happy .lipH{opacity:1}
.happy .head-all{transform:rotate(-4deg)}
@keyframes wag{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes flop{0%,82%,100%{transform:rotate(0)}86%{transform:rotate(4deg)}90%{transform:rotate(-3deg)}94%{transform:rotate(1.5deg)}97%{transform:rotate(0)}}
@keyframes breathe{50%{transform:scale(1.008,.99)}}
@media (prefers-reduced-motion:reduce){
  .alive .tail,.alive .eye,.alive .ear-r,.alive .ear-l,.alive .dog{animation:none}
  .puff,.balloon{animation-duration:.01s}
  .sheet .selsvg .ants{animation:none}
  .win.mogshake,.sheet.mogpunch,.mogbtn,.mogbtn.pop{animation:none}

  const caret = () => { const c = document.createElement('span'); c.className = 'caret'; return c; };

  typed.className = 'hl'; cmd.append(typed, cr);

  await wait(1100, tok);
  const l1 = line('Ищу самую красивую девушку');
  await dots(l1, 300);
  await wait(300, tok);
  l1.insertAdjacentHTML('beforeend', ` найдена: <span class="ok">${CONFIG.name} ✓</span>`);
  await wait(1000, tok);
  const l2 = line('Ищу котика');

  l2.insertAdjacentHTML('beforeend', ` <span class="err">✗ у ${CONFIG.nameGen} аллергия на котиков</span>`);
  await catSays(catImgs[0], 'Котик смотрит с укором', CONFIG.catText);   // котик не согласен
  const l3 = line('Беру таксу');

  await catSays(catImgs[1], 'Котик ничего не понимает', CONFIG.catText2);   // а котик так и не понял

/* ============================== живая такса ============================== */
let petting = false, lastPet = 0, lastFrame = 0, petTotal = 0, petSessions = 0, lastHeart = 0, lastSay = 0, says = 0;
let taps = 0, asked = false, interacted = false, compIdx = 0, compOrder = [];
function wakeDog() {
  mode = 'pet';

  setTool('paw');

}
function onDog(x, y) {

  const legs = p.y > 250 && p.y < 304 && (p.x > 70 && p.x < 130 || p.x > 294 && p.x < 356);
  return inE(HX, 142, 72, 76) || inE(258, 152, 16, 64) || inE(2 * HX - 258, 152, 16, 64) || inE(208, 226, 156, 52) || legs;
}
function petAt(x, y) {

    petting = true; petSessions++;
    if (dogSvg.classList.contains('alive')) dogSvg.classList.add('happy');
    sfx.pant(true);
    setStatus(`Гав. Таксу погладили ${petSessions} ${plural(petSessions, 'раз', 'раза', 'раз')}`);
  }
  lastPet = now;
  if (lastFrame) petTotal += Math.min(60, now - lastFrame);
  lastFrame = now;
  if (now - lastHeart > 170) { lastHeart = now; puff(x, y, heartSVG([COL.blush, COL.red, COL.text][Math.floor(Math.random() * 3)])); }

    puff(h.x, h.y, `<span class="say">${['гав', 'гав!', 'уважаю'][says++ % 3]}</span>`);

}
setInterval(() => {
  if (petting && performance.now() - lastPet > 450) {
    petting = false; lastFrame = 0;
    dogSvg.classList.remove('happy'); sfx.pant(false);
    if (!asked && petTotal > 350) { asked = true; setTimeout(askQuestion, 700); }   // вопрос сразу после первого поглаживания; мышь, пролетевшая мимо, не считается
  }
}, 120);
function nextCompliment() {
  if (compIdx >= compOrder.length) {
    compOrder = CONFIG.compliments.map((c, i) => i).sort(() => Math.random() - .5);
    compIdx = 0;
  }
  return CONFIG.compliments[compOrder[compIdx++]];
}
function tapDog() {
  interacted = true; taps++;

  if (!asked && taps >= 3) { asked = true; setTimeout(askQuestion, 2600); }
}

let pd = null;
sheet.addEventListener('pointerdown', e => {
  if (mode !== 'pet') return;
  pd = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, t: performance.now(), moved: 0, id: e.pointerId };
  if (e.pointerType !== 'mouse') { try { sheet.setPointerCapture(e.pointerId); } catch (_) {} }
});
sheet.addEventListener('pointermove', e => {
  showPos(e.clientX, e.clientY);
  if (mode !== 'pet') return;
  const touching = pd && pd.id === e.pointerId;
  if (e.pointerType !== 'mouse' && !touching) return;
  let d = 0;
  if (touching) { d = Math.hypot(e.clientX - pd.lx, e.clientY - pd.ly); pd.moved += d; pd.lx = e.clientX; pd.ly = e.clientY; }
  else d = Math.hypot(e.movementX || 0, e.movementY || 0);
  if (d > .5 && onDog(e.clientX, e.clientY)) petAt(e.clientX, e.clientY);
});
const endPd = e => {
  if (mode !== 'pet' || !pd || pd.id !== e.pointerId) { pd = null; return; }
  const tap = pd.moved < 10 && performance.now() - pd.t < 500;
  pd = null;
  if (tap && e.type === 'pointerup' && onDog(e.clientX, e.clientY)) tapDog();
};
sheet.addEventListener('pointerup', endPd);
sheet.addEventListener('pointercancel', endPd);
sheet.addEventListener('pointerleave', () => { if (!pd) posEl.textContent = ''; });

function flee(btn, other, px, py) {
  btn.style.position = 'fixed';
  btn.style.zIndex = 2600;
  btn.style.transition = reduced ? 'none' : 'left .18s ease-out, top .18s ease-out';
  const bw = btn.offsetWidth, bh = btn.offsetHeight, o = other.getBoundingClientRect();
  let x = 16, y = 16;
  for (let i = 0; i < 20; i++) {
    x = 16 + Math.random() * Math.max(1, innerWidth - bw - 32);
    y = 16 + Math.random() * Math.max(1, innerHeight - bh - 90);
    const hit = x < o.right + 24 && x + bw > o.left - 24 && y < o.bottom + 24 && y + bh > o.top - 24;
    const far = px == null || px === 0 && py === 0 || Math.hypot(x + bw / 2 - px, y + bh / 2 - py) > bw;

}

function inkPt(e) { const r = ink.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * ink.width, y: (e.clientY - r.top) / r.height * ink.height }; }

const sizeIx = Object.fromEntries(Object.keys(SIZES).map(t => [t, 2]));
const sizeOf = t => SIZES[t][sizeIx[t]];

  ictx.lineWidth = sizeOf(SIZES[tool] ? tool : 'pencil');

  if (x0 < 0 || y0 < 0 || x0 >= Wd || y0 >= Ht) return;
  if (wand && wand.mask[y0 * Wd + x0]) { wandOff(); sfx.click(); setStatus('Выделение снято'); return; }   // ещё раз по выделенному: снять
  const r = regionAt(composite(PX()).getContext('2d').getImageData(0, 0, Wd, Ht).data, Wd, Ht, x0, y0);
  if (r.count < 40) { sfx.error(); setStatus('Тут слишком маленький кусочек. Нажми внутри области'); return; }
  const mask = growMask(r.mask, Wd), d = maskOutline(mask, Wd, Ht);
  wand = { mask, path: new Path2D(d) };
  wandPaths.forEach(q => q.setAttribute('d', d));
  sfx.pop();
  // палочка остаётся в руке, как в SAI: чем рисовать, выбирают сами
  setStatus(app.classList.contains('narrow') ? 'Выделено! Выбери, чем рисовать' : 'Выделено! Теперь выбери, чем рисовать. Снять: Esc');
}
function wandOff() {
  if (!wand) return false;
  wand = null;
  wandPaths.forEach(q => q.setAttribute('d', 'M0 0'));
  return true;
}

/* ---------- указатель над холстом ---------- */
ink.addEventListener('pointerdown', e => {
  if (mode !== 'draw') return;
  e.preventDefault();
  const p = inkPt(e);
  if (tool !== 'text') commitText();
  if (tool !== 'select' && tool !== 'lasso') commitFloat();
  if (tool === 'heart') { const k = sizeOf('heart'); snapStart(); inWand(() => stampHeart(p)); snapEnd({ x: p.x - 9.1 * k, y: p.y - 8.4 * k, w: 18.2 * k, h: 16.8 * k }); sfx.pop(); return; }
  if (tool === 'wand') { wandAt(p); return; }
  if (tool === 'bucket') { floodFill(p); return; }
  if (tool === 'picker') { pickAt(p); return; }
  if (tool === 'zoom') { setZoom(!zoomed, e); setStatus(zoomed ? 'Масштаб ×2. Нажми лупой ещё раз, чтобы вернуть' : 'Масштаб 100%'); return; }
  if (tool === 'text') { commitText(); return; }   // поле для надписи появится по щелчку, так телефон покажет клавиатуру
  try { ink.setPointerCapture(e.pointerId); } catch (_) {}
  if (tool === 'select' || tool === 'lasso') { selDown(e, p); return; }
  snapStart();
  if (tool === 'spray') {
    stroke = { id: e.pointerId, last: p, box: boxAt(p, sprayR() + 2) };
    sprayAt(p);
    stroke.timer = setInterval(() => { if (stroke && stroke.timer) sprayAt(stroke.last); }, 40);
    sfx.scratch(true); sfx.scratchLevel(4);
    return;
  }
  inkStyle();
  inWand(() => { ictx.beginPath(); ictx.arc(p.x, p.y, ictx.lineWidth / 2, 0, Math.PI * 2); ictx.fill(); });
  stroke = { last: p, mid: p, id: e.pointerId, box: boxAt(p, ictx.lineWidth) };
  sfx.scratch(true);
});
ink.addEventListener('click', e => { if (mode === 'draw' && tool === 'text') startText(inkPt(e)); });
ink.addEventListener('pointermove', e => {
  showPos(e.clientX, e.clientY);
  if (sel && !sel.cv) { selMove(e, inkPt(e)); return; }
  if (!stroke || stroke.id !== e.pointerId) return;
  if (stroke.timer) { stroke.last = inkPt(e); sprayAt(stroke.last); return; }
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  inkStyle();
  inWand(() => {
    for (const ev of (evs.length ? evs : [e])) {
      const p = inkPt(ev), mid = { x: (stroke.last.x + p.x) / 2, y: (stroke.last.y + p.y) / 2 };
      ictx.beginPath(); ictx.moveTo(stroke.mid.x, stroke.mid.y); ictx.quadraticCurveTo(stroke.last.x, stroke.last.y, mid.x, mid.y); ictx.stroke();
      sfx.scratchLevel(Math.hypot(p.x - stroke.last.x, p.y - stroke.last.y) / 2);
      growBox(stroke.box, p, ictx.lineWidth);
      stroke.last = p; stroke.mid = mid;
    }
  });
});
const endStroke = e => {
  if (sel && !sel.cv) { selUp(e); return; }
  if (!stroke || stroke.id !== e.pointerId) return;
  const s = stroke;
  stroke = null;
  clearInterval(s.timer);
  sfx.scratch(false);
  snapEnd(s.box);
};
ink.addEventListener('pointerup', endStroke);
ink.addEventListener('pointercancel', endStroke);

/* клавиши: Ctrl+Z, Ctrl+Y, а для выделения Delete, Esc и Enter */
addEventListener('keydown', e => {
  if (e.target.closest?.('input, textarea')) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && (e.code === 'KeyZ' || e.code === 'KeyY')) {
    if (!showDone) return;
    e.preventDefault();
    if (e.code === 'KeyY' || e.shiftKey) redo(); else undo();
    return;
  }
  if (!sel) {
    if (e.key === 'Escape' && mode === 'draw' && wandOff()) { e.preventDefault(); setStatus('Выделение снято'); }
    return;
  }
  if (e.key === 'Escape') { e.preventDefault(); cancelFloat(); setStatus('Выделение отменено'); }
  else if (!sel.cv) return;
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); commitFloat(true); setStatus('Стёрто. Вернуть: Ctrl+Z'); }
  else if (e.key === 'Enter') { e.preventDefault(); commitFloat(); }
});

/* картинка для отправки: такса и её рисунок */
async function exportPNG() {
  settle();
  const c = composite(2);
  return new Promise(r => c.toBlob(r, 'image/png'));
}
async function finishDrawing() {
  let blob;
  try { blob = await exportPNG(); } catch (e) { blob = null; }
  if (!blob) { await dialog({ title: 'Не получилось', icon: 'warn', body: 'Браузер не дал собрать картинку. Сделай скриншот экрана, так тоже можно ♡' }); return; }
  const url = URL.createObjectURL(blob);
  const file = new File([blob], 'taksa-otvet.png', { type: 'image/png' });
  const canShare = !PREVIEW && navigator.canShare && navigator.canShare({ files: [file] });
  const buttons = [];
  if (canShare) buttons.push({ label: 'Отправить', def: true, keep: true, action: async () => { try { await navigator.share({ files: [file], title: 'Мой ответ ♡' }); } catch (_) {} } });
  if (!PREVIEW) buttons.push({ label: 'Сохранить', def: !canShare, keep: true, action: () => download(url) });
  buttons.push({ label: 'Закрыть', value: 'close', def: PREVIEW });
  const note = matchMedia('(pointer: coarse)').matches
      ? 'Если кнопки не сработают, зажми картинку пальцем и выбери «Сохранить».'
      : 'Ещё можно нажать на картинку правой кнопкой и выбрать «Сохранить картинку как…».';
  await dialog({
    title: 'Твой шедевр', icon: null, width: 330,
    body: `Отправь мне эту картинку ♡<img class="result" src="${url}" alt="Такса и твой рисунок"><span class="note">${note}</span>`,
    buttons,
  });
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function download(url) {
  const a = document.createElement('a');
  a.href = url; a.download = 'taksa-otvet.png';
  document.body.appendChild(a); a.click(); a.remove();
}

const isShown = w => !w.hidden && !w.classList.contains('min');
function focusWin(w) {

}
function taskAdd(w) {

  const b = document.createElement('button');
  b.type = 'button'; b.className = 'task';
  b.innerHTML = ICON[w.dataset.ico] + `<span>${w.dataset.title}</span>`;
  b.setAttribute('aria-label', w.dataset.title);

  b.addEventListener('click', () => {

}
function unMin(w) {

}
async function minimizeWin(w) {

async function restoreWin(w) {

}
function toggleMax(w) {

}
function taskRemove(w) { if (w._task) { w._task.remove(); w._task = null; } }
async function zoomRect(a, b) {
  if (reduced) return;
  const z = $('#zoom');
  z.hidden = false;
  await tween(230, e => {
    z.style.left = lerp(a.left, b.left, e) + 'px'; z.style.top = lerp(a.top, b.top, e) + 'px';
    z.style.width = lerp(a.width, b.width, e) + 'px'; z.style.height = lerp(a.height, b.height, e) + 'px';
  }, EASE.out);
  z.hidden = true;
}
async function openWin(w, from) {

  w.hidden = false;

  w.style.visibility = '';

}
function closeWin(w) {

    if (!showDone) { run++; songOff(); }

}
function shake(w) { w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake'); sfx.error(); }
function centerWin(w) {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  w.style.left = Math.max(0, (sw - w.offsetWidth) / 2) + 'px';
  w.style.top = Math.max(0, (sh - w.offsetHeight) * .42) + 'px';
}
function dialog({ title, icon = 'info', body, buttons = [{ label: 'OK', value: true, def: true }], width, noClose, closeOnDraw }) {
  return new Promise(resolve => {
    closeStart(); closeMenu();
    const w = document.createElement('section');
    const tid = 'dt' + (++zTop);
    w.className = 'win dlg' + (noClose ? ' must' : '');
    if (closeOnDraw) w.dataset.draw = '';
    w.setAttribute('role', 'dialog'); w.setAttribute('aria-modal', 'true'); w.setAttribute('aria-labelledby', tid);
    if (width) w.style.width = `min(${width}px, 100%)`;
    w.innerHTML = `<header class="tb"><span class="tt" id="${tid}">${title}</span><button class="tbb x" type="button" aria-label="Закрыть">${ICON.x}</button></header>`
      + `<div class="dlg-body">${icon ? `<div class="dlg-ic">${ICON[icon]}</div>` : ''}<div class="dlg-txt">${body}</div></div><div class="dlg-btns"></div>`;
    const row = w.querySelector('.dlg-btns');
    let done = false;
    const finish = v => { if (done) return; done = true; w.remove(); resolve(v); };
    w._finish = finish;
    let yesBtn = null;
    buttons.forEach(b => {
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'btn' + (b.def ? ' default' : ''); el.textContent = b.label;
      row.appendChild(el);
      if (b.def) yesBtn = el;
      if (b.runaway) {
        let n = 0;
        const dodge = e => {
          if (n >= b.runaway.length - 1) return;
          if (e) e.preventDefault();
          n++; el.textContent = b.runaway[n]; sfx.pop();
          if (e && e.type === 'pointerdown') dodgeAt = performance.now();
          if (!el._spot) {
            el._spot = document.createElement('span');
            el._spot.style.cssText = `display:inline-block;width:${el.offsetWidth}px;height:${el.offsetHeight}px`;
            el.before(el._spot);
          }
          flee(el, yesBtn || row, e && e.clientX, e && e.clientY);
        };
        el.addEventListener('pointerdown', dodge);
        el.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse' && performance.now() - touchAt > 800) dodge(e); });
        el.addEventListener('click', e => {
          if (performance.now() - dodgeAt < 500) return;   // тот же тап, что заставил кнопку убежать
          if (n < b.runaway.length - 1) { dodge(e); return; }
          finish(b.value);
        });
        return;
      }
      el.addEventListener('click', async () => {
        if (performance.now() - dodgeAt < 500) return;
        if (b.action) await b.action(el);
        if (!b.keep) finish(b.value);
      });
    });
    w.querySelector('.tbb').addEventListener('click', () => {
      if (noClose) { shake(w); return; }
      finish(buttons.find(b => b.value === 'close' || b.value === 'later')?.value ?? null);
    });
    w.addEventListener('pointerdown', () => focusWin(w));
    stage.appendChild(w);
    centerWin(w);
    focusWin(w);
    (row.querySelector('.default') || row.firstChild)?.focus({ preventScroll: true });
    sfx.ding();
  });
}

function mkBalloon(title, text) {
  const b = document.createElement('div');
  b.className = 'balloon';
  b.setAttribute('role', 'status');
  b.innerHTML = `<b>${ICON.info}${title}</b>${text}<span class="bx" aria-hidden="true">✕</span>`;
  b.addEventListener('click', () => b.remove());
  return b;
}
function hideBalloons() { $$('.balloon').forEach(b => b.remove()); }
function placeBalloon(b, ax, ay, boxW, boxH) {
  const bw = b.offsetWidth, bh = b.offsetHeight;
  const left = clamp(ax - 30, 6, Math.max(6, boxW - bw - 6));
  let top = ay - bh - 16, below = false;
  if (top < 4) { top = ay + 16; below = true; }
  top = Math.min(top, Math.max(4, boxH - bh - 4));
  b.style.left = left + 'px'; b.style.top = top + 'px';
  b.style.setProperty('--tail', clamp(ax - left - 6, 14, bw - 30) + 'px');
  b.classList.toggle('below', below);
}
let balloonTimer = 0;
function balloonAt(title, text, sx, sy, ms = 5200) {
  hideBalloons();
  const b = mkBalloon(title, text);
  W.paint.appendChild(b);   // внутри окна: подсказке хватает места над таксой даже на телефоне
  const a = W.paint.getBoundingClientRect(), p = toClient(dogSvg, sx, sy);
  placeBalloon(b, p.x - a.left, p.y - a.top, a.width, a.height);
  clearTimeout(balloonTimer);
  balloonTimer = setTimeout(() => b.remove(), ms);
}
const balloonDog = (title, text) => balloonAt(title, text, 300, 84, 5600);
const balloonTop = (title, text, ms = 4800) => balloonAt(title, text, 24, 0, ms);
function balloonUnder(title, text, el, ms = 5200) {
  hideBalloons();
  const b = mkBalloon(title, text);
  W.paint.appendChild(b);
  const a = W.paint.getBoundingClientRect(), r = el.getBoundingClientRect();
  const ax = r.left + r.width / 2 - a.left, bw = b.offsetWidth, left = clamp(ax - 30, 6, Math.max(6, a.width - bw - 6));
  b.style.left = left + 'px'; b.style.top = (r.bottom - a.top + 14) + 'px';
  b.style.setProperty('--tail', clamp(ax - left - 6, 14, bw - 30) + 'px');
  b.classList.add('below');
  clearTimeout(balloonTimer);
  balloonTimer = setTimeout(() => b.remove(), ms);
}
function balloonFixed(title, text, el, ms = 4200) {
  hideBalloons();
  const b = mkBalloon(title, text);
  b.classList.add('fixed');
  document.body.appendChild(b);
  const r = el.getBoundingClientRect();
  const bw = b.offsetWidth, bh = b.offsetHeight;
  const left = clamp(r.left + r.width / 2 - bw + 30, 8, innerWidth - bw - 8);
  b.style.left = left + 'px'; b.style.top = (r.top - bh - 16) + 'px';
  b.style.setProperty('--tail', clamp(r.left + r.width / 2 - left - 6, 14, bw - 30) + 'px');
  clearTimeout(balloonTimer);
  balloonTimer = setTimeout(() => b.remove(), ms);
}

/* ============================== раскладка ============================== */
const setStatus = t => { $('#status').textContent = t; };
function layout() {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const narrow = sw < 640;
  app.classList.toggle('narrow', narrow);
  const icons = $('#icons');
  // Рисовалка: подгоняем холст под свободное место
  const pw = W.paint;
  if (!pw.hidden) {
    pw.classList.toggle('narrow', narrow);
    const big = pw.classList.contains('max');
    const reserveL = narrow || big ? 0 : 104, reserveB = narrow && !big ? icons.offsetHeight + 10 : 0;
    const maxW = narrow || big ? sw : Math.min(940, sw - reserveL), maxH = sh - reserveB;
    pw.style.width = maxW + 'px';
    area.style.height = '0px'; sheet.style.width = sheet.style.height = '0px';
    const pbody = pw.querySelector('.pbody'), pad = narrow ? 6 : 8, pal = $('#palette'), room = maxW - 6 - 34 - 6 - 4 - 13;
    const fit = wrap => {   // wrap: «МОГНУТЬ» на своей строке под цветами
      pal.classList.toggle('wrap', wrap);
      pal.style.setProperty('--sw', (narrow ? clamp(Math.floor((wrap ? room : room - $('#mog').offsetWidth - 6) / 14), 12, 20) : 17) + 'px');
      const fixedH = pw.offsetHeight - pbody.offsetHeight + (narrow ? $('#tools').offsetHeight + 3 : 0);
      return { fixedH, s: clamp(Math.min((area.clientWidth - pad * 2) / CW, (maxH - fixedH - pad * 2) / CH), .3, 1.6) };
    };
    let f = fit(false);
    if (narrow) {   // на телефоне кнопка уходит вниз, если рядом с ней цвета мелкие, а лист от этого не уменьшится (или цвета совсем не влезают)
      const beside = (room - $('#mog').offsetWidth - 6) / 14;
      if (beside < 20) { const w = fit(true); f = beside < 12 || w.s >= f.s - .002 ? w : fit(false); }
    }
    const { fixedH, s } = f;
    const chromeW = pw.offsetWidth - area.clientWidth;
    sheet.style.width = (CW * s).toFixed(1) + 'px'; sheet.style.height = (CH * s).toFixed(1) + 'px';
    area.style.height = (big ? Math.max(CH * s + pad * 2, maxH - fixedH) : CH * s + pad * 2).toFixed(1) + 'px';   // развёрнутое окно до низа, лист в углу, как в Paint
    if (!narrow && !big) pw.style.width = clamp(chromeW + CW * s + pad * 2 + 30, 540, maxW).toFixed(0) + 'px';
    if (big) { pw.style.left = '0px'; pw.style.top = '0px'; }
    else if (pw.dataset.moved && !narrow) keepInside(pw);
    else {
      pw.style.left = (narrow ? 0 : reserveL + Math.max(0, (sw - reserveL - pw.offsetWidth) / 2)) + 'px';
      pw.style.top = Math.max(0, (maxH - pw.offsetHeight) / (narrow ? 3 : 2)) + 'px';
    }
  }
  const tw = W.term;

    const w = narrow || big ? sw : Math.min(640, sw - 150), h = big ? sh : Math.min(narrow ? 330 : 350, sh - 10);
    tw.style.width = w + 'px'; tw.style.height = h + 'px';
    tw.style.left = (narrow || big ? 0 : (sw - w) / 2 + 40) + 'px';
    tw.style.top = (big ? 0 : Math.max(0, (sh - h) * .38)) + 'px';
  }
  const cw = W.cat;
  if (!cw.hidden) { if (cw.dataset.moved && !narrow) keepInside(cw); else centerWin(cw); }
  const nw = W.notes;
  if (!nw.hidden && nw.classList.contains('max')) {
    nw.style.width = sw + 'px'; nw.style.height = sh + 'px'; nw.style.left = nw.style.top = '0px';
  } else if (!nw.hidden && !nw.dataset.moved) {
    const w = narrow ? sw : Math.min(470, sw - 150), h = Math.min(440, sh - (narrow ? icons.offsetHeight + 16 : 20));
    nw.style.width = w + 'px'; nw.style.height = h + 'px';
    nw.style.left = (narrow ? 0 : sw - w - 10) + 'px';
    nw.style.top = (narrow ? 0 : Math.max(0, (sh - h) / 2)) + 'px';

function keepInside(w) {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  w.style.left = clamp(parseFloat(w.style.left) || 0, -w.offsetWidth + 80, sw - 80) + 'px';
  w.style.top = clamp(parseFloat(w.style.top) || 0, 0, sh - 30) + 'px';
}
let rz = 0;
addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { setZoom(false); layout(); }); });

/* перетаскивание окон мышкой за заголовок */
document.addEventListener('pointerdown', e => {
  const tb = e.target.closest('.win > .tb');
  if (!tb || e.pointerType !== 'mouse' || e.button !== 0 || e.target.closest('button')) return;
  const w = tb.parentNode;
  if (w === W.intro || w.classList.contains('max') || app.classList.contains('narrow')) return;
  const r = w.getBoundingClientRect(), st = stage.getBoundingClientRect(), ox = e.clientX - r.left, oy = e.clientY - r.top;
  const move = ev => {
    w.style.left = clamp(ev.clientX - st.left - ox, -r.width + 80, st.width - 80) + 'px';
    w.style.top = clamp(ev.clientY - st.top - oy, 0, st.height - 30) + 'px';
    w.dataset.moved = '1';
  };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);
});
stage.addEventListener('pointerdown', e => { const w = e.target.closest('.win'); if (w) focusWin(w); });

/* ускорение показа по нажатию на окно */
function toggleSpeed(e) {
  if (mode !== 'show' && !W.term.classList.contains('active')) return;
  if (songTok || (mode === 'show' && showDone)) return;   // под песню темп ведёт она, а после «Готово!» ускорять нечего
  if (e.target.closest('.tbb')) return;
  speed = speed > baseSpeed ? baseSpeed : baseSpeed * 3;
  if (mode === 'show') setStatus(drawingStatus());
}
W.paint.addEventListener('pointerdown', e => { if (mode === 'show') toggleSpeed(e); });
W.term.addEventListener('pointerdown', e => { if (!W.term.hidden && mode !== 'pet' && mode !== 'draw') toggleSpeed(e); });

/* ============================== меню и кнопки ============================== */
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; $$('[data-menu][aria-expanded]').forEach(b => b.removeAttribute('aria-expanded')); } }
/* выпадающее меню: пункты [id, текст, клавиши, выключен] или '-' */
function openMenu(b, items, onPick) {
  b.setAttribute('aria-expanded', 'true');
  menuEl = document.createElement('div');
  menuEl.className = 'dropdown'; menuEl.setAttribute('role', 'menu');
  menuEl.innerHTML = items.map(it => it === '-' ? '<hr>'
    : `<button type="button" role="menuitem" data-f="${it[0]}"${it[3] ? ' disabled' : ''}><span>${it[1]}</span>${it[2] && !app.classList.contains('narrow') ? `<kbd>${it[2]}</kbd>` : ''}</button>`).join('');
  W.paint.appendChild(menuEl);
  const pr = W.paint.getBoundingClientRect(), br = b.getBoundingClientRect();
  menuEl.style.left = clamp(br.left - pr.left, 3, Math.max(3, pr.width - menuEl.offsetWidth - 3)) + 'px';
  menuEl.style.top = (br.bottom - pr.top) + 'px';
  menuEl.addEventListener('click', ev => {
    const f = ev.target.closest('[data-f]');
    if (!f || f.disabled) return;
    closeMenu();
    onPick(f.dataset.f);
  });
}
/* толщина: справа от кнопки, а на телефоне под ней */
function openSizes(b) {
  const t = sizeTool(), word = t === 'heart' || t === 'text' ? 'Размер' : 'Толщина';
  b.setAttribute('aria-expanded', 'true');
  menuEl = document.createElement('div');
  menuEl.className = 'dropdown sizes'; menuEl.setAttribute('role', 'menu'); menuEl.setAttribute('aria-label', word);
  menuEl.innerHTML = [2, 4, 7, 11, 16, 23, 32].map((h, i) => `<button type="button" role="menuitemradio" aria-checked="${i === sizeIx[t]}" aria-label="${word} ${i + 1}" data-i="${i}">${
    t === 'heart' ? `<svg viewBox="0 0 16 14" width="${(10 + h * 1.1).toFixed(1)}"><path d="${heartPath}"/></svg>`
    : t === 'text' ? `<b style="font-size:${12 + h}px">Аа</b>` : `<i style="height:${h}px"></i>`}</button>`).join('');
  W.paint.appendChild(menuEl);
  const pr = W.paint.getBoundingClientRect(), br = b.getBoundingClientRect(), narrow = app.classList.contains('narrow');
  menuEl.style.left = clamp((narrow ? br.right - menuEl.offsetWidth : br.right + 2) - pr.left, 3, Math.max(3, pr.width - menuEl.offsetWidth - 3)) + 'px';
  menuEl.style.top = clamp((narrow ? br.bottom : br.top) - pr.top, 3, Math.max(3, pr.height - menuEl.offsetHeight - 3)) + 'px';
  menuEl.addEventListener('click', ev => {
    const f = ev.target.closest('[data-i]');
    if (!f) return;
    closeMenu();
    sizeIx[t] = +f.dataset.i;
    if (tool !== t) setTool(t);
    setStatus(`${word}: ${sizeIx[t] + 1} из ${SIZES[t].length}`);
  });
}
function paletteLove() {
  balloonTop('Палитра', 'Ты для меня такая радость, как жёлтый цвет вместе с белым', 7000);
  $$('.sw[data-c="#fff200"], .sw[data-c="#ffffff"]').forEach(s => { s.classList.remove('glow'); void s.offsetWidth; s.classList.add('glow'); });
}
$('#menubar').addEventListener('click', e => {
  const b = e.target.closest('[data-menu]');
  if (!b) return;
  const m = b.dataset.menu;
  const wasOpen = menuEl && b.getAttribute('aria-expanded') === 'true';
  closeMenu();
  if (mode === 'show' && m !== 'help') return;
  if (wasOpen) return;
  if (m === 'file') openMenu(b, [['replay', 'Нарисовать заново'], ['draw', 'Порисовать самой'], ['save', 'Сохранить картинку…'], '-', ['close', 'Выход']], f => {
    if (f === 'replay') replay();
    else if (f === 'draw') enterDraw('pencil');
    else if (f === 'save') { if (showDone) finishDrawing(); }
    else if (f === 'close') closePaintAsk();
  });
  else if (m === 'edit') openMenu(b, [['undo', 'Отменить', 'Ctrl+Z', !hist.undo.length && !sel && !txt], ['redo', 'Вернуть', 'Ctrl+Y', !hist.redo.length], ['deselect', 'Снять выделение', 'Esc', !wand], '-', ['me', 'Исправить меня…']], f => {
    if (f === 'undo') undo();
    else if (f === 'redo') redo();
    else if (f === 'deselect') { wandOff(); setStatus('Выделение снято'); }
    else balloonTop('Правка', 'Прости меня за всё', 6000);
  });
  else if (m === 'image') openMenu(b, [['clear', 'Очистить мой рисунок']], () => clearAll());
  else if (m === 'help') about();
  else if (m === 'view') balloonTop('Вид', 'Давай как-нибудь сделаем фотку с нашей собакой?', 6000);
  else if (m === 'colors') paletteLove();
});
$('.curcol').addEventListener('click', () => { if (mode !== 'show') paletteLove(); });
document.addEventListener('pointerdown', e => {
  if (menuEl && !e.target.closest('.dropdown') && !e.target.closest('[data-menu]')) closeMenu();
  if (!$('#startmenu').hidden && !e.target.closest('#startmenu') && !e.target.closest('#start')) closeStart();
});
function about() {
  dialog({ title: 'О программе', icon: 'paint', body: `<b>Рисовалка 2.0</b><br>Сделано специально для ${CONFIG.nameGen}.` });
}
async function closePaintAsk() {
  if (!showDone) { closeWin(W.paint); return; }
  const r = await dialog({
    title: 'Рисовалка', icon: 'warn',
    body: 'Сохранить изменения в «такса.bmp»?',
    buttons: [{ label: 'Да', value: 'y', def: true }, { label: 'Конечно да', value: 'y' }, { label: 'Отмена', value: 'close' }],
  });
  if (r === 'y') closeWin(W.paint);
}

function buildToolsAndPalette() {
  const tools = $('#tools');
  TOOLS.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tool'; b.dataset.tool = t.id;
    b.title = t.name; b.setAttribute('aria-label', t.name);
    b.innerHTML = TOOL_ICON[t.id];
    b.addEventListener('click', () => {
      if (mode === 'show' || mode === 'idle') return;
      if (t.id === 'paw') { if (mode === 'draw') exitDraw(); return; }
      if (mode !== 'draw') enterDraw(t.id); else setTool(t.id);
      if (mode === 'draw' && t.hint) setStatus(t.hint);
    });
    tools.appendChild(b);
  });
  const sb = document.createElement('button');
  sb.type = 'button'; sb.className = 'tool sizebtn'; sb.dataset.menu = 'size';
  sb.title = 'Толщина'; sb.setAttribute('aria-label', 'Толщина'); sb.setAttribute('aria-haspopup', 'menu');
  sb.innerHTML = TOOL_ICON.size;
  sb.addEventListener('click', () => {
    if (mode === 'show' || mode === 'idle') return;
    const wasOpen = menuEl && sb.getAttribute('aria-expanded') === 'true';
    closeMenu();
    if (wasOpen) return;
    if (mode !== 'draw') enterDraw(sizeTool());
    if (mode === 'draw') openSizes(sb);
  });
  tools.appendChild(sb);
  const sw = $('#swatches');
  PALETTE.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw'; b.dataset.c = c;
    b.style.setProperty('--c', c); b.setAttribute('aria-label', 'Цвет ' + c);
    b.addEventListener('click', () => { if (mode === 'pet' || mode === 'draw') { setFG(c); if (mode === 'pet') enterDraw(tool === 'paw' || !tool ? 'pencil' : tool); } });
    sw.appendChild(b);
  });
}

/* значки рабочего стола */
$('#icons').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  sfx.init();
  const a = b.dataset.act;
  if (a === 'pc') dialog({ title: 'Мой компьютер', icon: 'warn', body: 'Диск C: заполнен на 100%.<br>Всё место заняли Бог и ты.', buttons: [{ label: 'Так и должно быть', value: true, def: true }] });
  if (a === 'bin') dialog({ title: 'Корзина', icon: 'info', body: 'В корзине лежит котик.bmp: у тебя же аллергия на котиков.<br>Ещё тут были все обиды. Их я удалил навсегда.' });
  if (a === 'notes') openNotes(b);
  if (a === 'cat') openCat(b);
  if (a === 'paint') {
    if (!begun) { begin(); return; }
    if (W.paint.hidden) {
      if (showDone) { openWin(W.paint, b).then(() => { mode = 'pet'; wakeDog(); }); }
      else replay();
    } else focusWin(W.paint);
  }
});
/* котик.gif с рабочего стола: тот же котик, сколько угодно раз, окно закрывается крестиком */
async function openCat(from) {
  closeStart();
  const w = W.cat, img = $('#cat-img');
  if (!w.hidden) { focusWin(w); return; }
  $('#cat-cap').textContent = CONFIG.catText;
  if (!img.src) img.src = CAT_GIF;
  try { await img.decode(); } catch (_) {}
  await openWin(w, from);
  sfx.pop();
}
function openNotes(from) {
  closeStart();
  const list = CONFIG.compliments.map((c, i) => `${String(i + 1).padStart(2, ' ')}. ${c}`).join('\n');
  $('#notes-text').value = `Почему ты самая лучшая\n(неполный список: полный не помещается в память)\n\n${list}\n\nP.S. Список пополняется каждый день.`;
  if (W.notes.hidden) openWin(W.notes, from); else focusWin(W.notes);
}

/* меню «Пуск» */
function closeStart() { $('#startmenu').hidden = true; $('#start').setAttribute('aria-expanded', 'false'); }
$('#start').addEventListener('click', () => {
  sfx.init();
  const m = $('#startmenu'), open = m.hidden;
  m.hidden = !open; $('#start').setAttribute('aria-expanded', String(open));
  if (open) m.querySelector('.sm-item').focus({ preventScroll: true });
});
$('#startmenu').addEventListener('click', e => {
  const a = e.target.closest('[data-sm]')?.dataset.sm;
  if (!a) return;
  if (a === 'sound') { toggleSound(); return; }
  closeStart();
  if (a === 'replay') { if (!begun) begin(); else replay(); }
  if (a === 'notes') openNotes($('#start'));
  if (a === 'draw') { if (!begun) begin(); else enterDraw('pencil'); }
  if (a === 'off') dialog({
    title: 'Завершение работы', icon: 'question',
    body: petSessions >= 3 ? 'Такса наглажена, можно выключать.<br>Но лучше погладь её ещё разок ♡' : 'Выключить компьютер?<br>Не получится: такса ещё не наглажена.',
    buttons: [{ label: 'Ладно', value: true, def: true }],
  });
});
function toggleSound() {
  sfx.init();
  sfx.setMuted(!sfx.muted);
  $('#snd').innerHTML = sfx.muted ? ICON.spkoff : ICON.spk;
  $('#snd').setAttribute('aria-pressed', String(sfx.muted));
  $('#snd').setAttribute('aria-label', sfx.muted ? 'Включить звук' : 'Выключить звук');
  $('#sm-sound').textContent = sfx.muted ? 'Звук: выключен' : 'Звук: включён';
}
$('#snd').addEventListener('click', toggleSound);
const clockEl = $('#clock');
function tickClock() { clockEl.textContent = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }
/* время в двух городах считаем от UTC: в России нет перехода на летнее время */
const cityTime = utc => { const d = new Date(Date.now() + utc * 3600e3); return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0'); };
function daysToMeet() {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(CONFIG.meetDate || '');
  if (!m) return null;
  const now = new Date(), today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((Date.UTC(+m[1], m[2] - 1, +m[3]) - today) / 864e5);
}
clockEl.addEventListener('click', () => {
  let t = `В ${CONFIG.herCityIn} ${cityTime(CONFIG.herUTC)}, в ${CONFIG.myCityIn} ${cityTime(CONFIG.myUTC)}.`;
  const n = daysToMeet();
  if (n > 0) t += `<br>До встречи ${plural(n, 'остался', 'осталось', 'осталось')} ${n} ${plural(n, 'день', 'дня', 'дней')}.`;
  else if (n === 0) t += '<br>Встреча сегодня!';
  balloonFixed('Который час?', t, clockEl, 6500);
});

/* кнопки заголовка: свернуть, развернуть, закрыть */
stage.addEventListener('click', e => {
  const mn = e.target.closest('[data-min]'), mx = e.target.closest('[data-max]');
  if (mn || mx) { sfx.init(); sfx.click(); if (mn) minimizeWin(mn.closest('.win')); else toggleMax(mx.closest('.win')); return; }
  const x = e.target.closest('[data-close]');
  if (!x) return;
  const w = x.closest('.win');
  sfx.init();
  if (w === W.paint) closePaintAsk();
  else closeWin(w);
});
$('#b-clear').addEventListener('click', clearAll);
$('#mog').addEventListener('click', mog);
$('#b-undo').addEventListener('click', undo);
$('#b-done').addEventListener('click', () => finishDrawing());

/* первый экран */
$('#intro-open').addEventListener('click', () => { sfx.init(); begin(); });

/* ============================== старт ============================== */
function init() {
  $$('i[data-ico]').forEach(i => {
    const t = document.createElement('div');
    t.innerHTML = ICON[i.dataset.ico];
    const svg = t.firstElementChild;
    if (i.className) svg.setAttribute('class', i.className);
    svg.setAttribute('aria-hidden', 'true');
    i.replaceWith(svg);
  });
  $('#intro-txt').innerHTML = `<b>${CONFIG.name}, тебе сообщение!</b><br>От кого: ${CONFIG.from})<br>Внутри: такса, которая нарисуется прямо у тебя на глазах.`;
  $('#size').textContent = `${CW} × ${CH}`;
  $('#sm-band-name').innerHTML = `${CONFIG.name}<b>ОС</b>`;
  buildToolsAndPalette();
  sheet.appendChild(selSvg);
  setFG(COL.ink);
  setCursorKind('arrow');
  buildDog();
  layout();
  tickClock(); setInterval(tickClock, 10000);
  $('#intro-open').focus({ preventScroll: true });
  console.log('%cПривет, ' + CONFIG.name + '! 🐾', 'font: 700 20px sans-serif; color: #c9578e');
  console.log('Если ты открыла консоль, значит, ты слишком умная для этого мира. Такса одобряет.');
}
init();
})();
</script>
